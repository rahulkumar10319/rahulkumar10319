<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b18"/>
      <stop offset="100%" stop-color="#15102b"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- Neon line -->
  <path d="M0 245 L150 180 L280 225 L420 100 L560 185 L700 80 L850 165 L1000 70 L1200 125"
        fill="none"
        stroke="url(#line)"
        stroke-width="4"/>

  <!-- Dots -->
  <g fill="#00e5ff">
    <circle cx="120" cy="70" r="3"/>
    <circle cx="220" cy="45" r="2"/>
    <circle cx="930" cy="55" r="3"/>
    <circle cx="1080" cy="85" r="2"/>
  </g>

  <g fill="#a855f7">
    <circle cx="180" cy="205" r="3"/>
    <circle cx="420" cy="100" r="3"/>
    <circle cx="700" cy="80" r="3"/>
    <circle cx="1000" cy="70" r="3"/>
  </g>

  <!-- Name -->
  <text x="600" y="125"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="60"
        font-weight="bold">
    Rahul Kumar
  </text>

  <!-- Subtitle -->
  <text x="600" y="165"
        text-anchor="middle"
        fill="#67e8f9"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600">
    SOFTWARE ENGINEERING • DEVELOPER • PROBLEM SOLVER
  </text>

</svg>
